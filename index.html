<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Todo List</title><link rel="icon" href="todo-Icon.png"><script defer="defer" src="main.js"></script></head><body><div class="container"><div class="navBar"><div id="navBarHeader">Todo List</div><div class="navText addTaskBtn"><img src="b9250d9e54b0acc88461.png" alt="add button"><div>Add Task</div></div><div class="navText todayBtn"><img src="b341e81ef2266330e516.png" alt="Today's task"><div>Today</div></div><div class="navText next7daysBtn"><img src="64be7ede5d7e198431e4.png" alt="task for the Next 7 days"><div>Next 7 days</div></div><div class="myProjects"><div>My Projects</div><img src="da82e098c1247ee9149f.png" alt="Add Projects" class="addingMyProjects"></div><div class="projectsContainer"></div></div><div class="contentSection"><div id="contentHeader"></div><div class="tasks"><span id="tasksNumber"></span> tasks</div><div class="content"></div></div></div><dialog class="addTaskDialog"><form class="addTaskForm"><div><input id="taskName" name="taskName" placeholder="Task Name" required/></div><div><textarea name="description" id="description" placeholder="Description"></textarea></div><div><select name="project" id="project" required></select> <select name="priority" id="priority" required><option value="Low">LOW</option><option value="Medium" selected="selected">MEDIUM</option><option value="High">HIGH</option></select> <input type="date" id="dueDate" name="dueDate"/></div><button formmethod="dialog" type="button" class="cancelAddTask">Cancel</button> <button type="button" class="submitTask">Submit</button></form></dialog><dialog class="editTaskDialog"><form class="editTaskForm"><div><input id="editTaskName" name="editTaskName" placeholder="Edit Task Name" required/></div><div><textarea name="editDescription" id="editDescription" placeholder="Edit Description"></textarea></div><div><select name="editProject" id="editProject" required></select> <select name="editPriority" id="editPriority" required><option value="Low">LOW</option><option value="Medium" selected="selected">MEDIUM</option><option value="High">HIGH</option></select> <input type="date" id="editDueDate" name="editDueDate"/></div><button formmethod="dialog" type="button" class="cancelEditTask">Cancel</button> <button type="button" class="submitChanges">Save Changes</button></form></dialog><dialog class="addProjectDialog"><form class="addProjectForm"><h4>Add Project</h4><div><input name="projectName" id="projectName" placeholder="Project Name" required></div><div class="projectModalBtns"><button formmethod="dialog" type="button" class="cancelAddProject">Cancel</button> <button type="button" class="submitProject">Submit</button></div></form></dialog></body></html>
